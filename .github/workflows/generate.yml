name: Generate site

on:
  workflow_dispatch:
  schedule:
    # Daily rebuild (~3:17am Denver) so Amazon prices/images stay fresh once API access clears.
    - cron: "17 10 * * *"
  push:
    paths:
      - "data/**"
      - "templates/**"
      - "scripts/**"
      - ".github/workflows/generate.yml"
      - "index.html"

permissions:
  contents: write

concurrency:
  group: generate-site-main
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync with remote
        run: git pull --rebase origin main

      - name: Install Amazon API client
        continue-on-error: true
        run: pip install python-amazon-paapi

      - name: Enrich from Amazon Creators API (skips quietly until eligible)
        continue-on-error: true
        env:
          AMAZON_ACCESS_KEY: ${{ secrets.AMAZON_ACCESS_KEY }}
          AMAZON_SECRET_KEY: ${{ secrets.AMAZON_SECRET_KEY }}
          AMAZON_API_VERSION: "3.1"
          AMAZON_PARTNER_TAG: halcottmag-20
        run: python scripts/enrich.py

      - name: Run generator
        run: python scripts/generate.py

      - name: Commit generated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Always stage site output (clean URLs: /best, /reviews, /guides) and remove the legacy generated/ folder
          for d in generated best reviews guides compare; do
            if [ -e "$d" ] || git ls-files --error-unmatch "$d" >/dev/null 2>&1; then git add -A "$d"; fi
          done
          if [ -f search-index.v1.js ]; then git add search-index.v1.js; fi

          # Keep the last good Amazon data so a brief API outage doesn't blank photos/prices.
          # The generator only uses it while it is under 24 hours old (Amazon's caching limit).
          if [ -d data/enrichment ]; then git add -A data/enrichment; fi

          # Also stage root-level files the generator creates
          if [ -f sitemap.xml ]; then git add sitemap.xml; fi
          if [ -f robots.txt ]; then git add robots.txt; fi
          if [ -f index.html ]; then git add index.html; fi

          # Commit only if there are changes
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Update generated pages"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit"
          fi
